name: Supabase Keep Alive

on:
  schedule:
    # Runs every 5 days at 00:00 UTC
    - cron: "0 0 */5 * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase Project Active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔄 Pinging Supabase to keep project active..."
          echo "Project URL: $SUPABASE_URL"
          
          # Perform a simple query to keep the database active
          response=$(curl -w "\n%{http_code}" -sS "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 206 ]; then
            echo "✅ Successfully pinged Supabase (HTTP $http_code)"
            echo "Response: $body"
          else
            echo "❌ Failed to ping Supabase (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
          
      - name: Verify Project Status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔍 Verifying project is accessible..."
          
          # Try to access the health endpoint
          health_response=$(curl -w "\n%{http_code}" -sS "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY")
          
          health_code=$(echo "$health_response" | tail -n1)
          
          if [ "$health_code" -eq 200 ] || [ "$health_code" -eq 404 ]; then
            echo "✅ Project is active and responding"
          else
            echo "⚠️  Project returned unexpected status: HTTP $health_code"
          fi
          
          echo "🎉 Keep-alive workflow completed successfully!"
