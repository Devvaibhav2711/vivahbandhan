<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline - ShubhVivahBandhan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce7f3; /* Light pink background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #831843; /* Dark pink/maroon text */
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            margin-top: 0;
            color: #db2777; /* Pink-600 */
        }
        p {
            margin-bottom: 1.5rem;
            color: #4b5563; /* Gray-600 */
        }
        button {
            background-color: #db2777; /* Pink-600 */
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #be185d; /* Pink-700 */
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶❌</div>
        <h1>No Internet Connection</h1>
        <p>It looks like you're offline. Secure login and registration require an active internet connection.</p>
        <p>You can still view some cached pages and previously visited profiles.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
